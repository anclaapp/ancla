name: ancla
description: Ancla - fotos con voz para recordar por que las guardaste.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  record: ^5.1.2
  audioplayers: ^6.0.0
  path_provider: ^2.1.3
  path: ^1.9.0
  gal: ^2.3.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
