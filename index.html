<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ancla</title><meta name="theme-color" content="#6C3BE0"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"><style>:root{padding-top:env(safe-area-inset-top,0px)}
:root{
  /* escenario oscuro: la foto es la protagonista; morado, azul y amarillo como acentos */
  --bg:#0B0722; --surface:#181240; --ink:#FFFFFF; --ink2:#DCD6FA; --muted:#ABA3D8; --line:#2E2663;
  --brand:#7C4DFF; --on-brand:#FFFFFF; --soft:#2A2266; --blue:#7FA2FF; --blue-soft:#1B2A66;
  --yellow:#FFC83D; --on-yellow:#1B1446; --warn:#FFC83D; --on-warn:#1B1446; --danger:#FF8A80; --night:#000; --on-night:#FFFFFF;
  --display:'Fraunces',Georgia,serif; --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.easy{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 0;min-height:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{max-width:640px;margin:0 auto;padding-bottom:104px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.3px;text-wrap:balance}
h1{font-size:1.85rem;line-height:1.15}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted);font-size:.92rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.brand{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--brand)}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;background:none;border:0;color:var(--brand);font-weight:600;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.warn{background:var(--warn);border-color:transparent;color:var(--on-warn)}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card.warn .eyebrow{color:var(--on-warn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;
  background:var(--brand);color:var(--on-brand);font-weight:700;font-size:1rem;text-decoration:none}
.btn.alt{background:transparent;border:1.5px solid var(--brand);color:var(--brand)}
.btn.yellow{background:var(--yellow);color:var(--on-yellow)}
.btn.block{width:100%}
.btn.big{min-height:72px;font-size:1.15rem;border-radius:20px}
.btn[disabled]{opacity:.5}
.link{background:none;border:0;color:var(--brand);font-weight:600;min-height:44px;padding:0 4px}
.link.danger{color:var(--danger)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.88rem;font-weight:600}
.chip.on{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.chip.blue{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;color:var(--muted)}
.capture{display:grid;grid-template-columns:1fr;gap:10px}
.thread{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:64px}
.thread .name{font-weight:700;font-size:1.05rem}
.state{font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--blue-soft);color:var(--blue)}
.state.decidido{background:var(--soft);color:var(--brand)}
.state.cerrado{background:var(--line);color:var(--muted)}
.memo{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.memo .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;font-weight:700;color:var(--blue)}
.photo{position:relative;border-radius:12px;overflow:hidden;background:var(--soft);line-height:0}
.photo img{width:100%;max-height:60vh;object-fit:cover;display:block}
.pin{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:var(--yellow);color:var(--on-yellow);border:3px solid #fff;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.aud{display:flex;align-items:center;gap:10px}
.aud audio{flex:1;min-width:0;height:44px}
.dur{font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.group{font-family:var(--display);font-weight:600;font-size:1.1rem;padding-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav-in{display:flex;width:100%;max-width:640px}
.nav button{flex:1;min-height:56px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:.74rem;font-weight:700;border-radius:12px}
.nav button.on{color:var(--brand)}
.layer{position:fixed;inset:0;z-index:20;background:rgba(18,13,49,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.layer.full .sheet{height:94vh}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=datetime-local],textarea,select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:500;color:var(--ink)}
textarea{min-height:96px;resize:vertical}
.rec{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0}
.recbtn{width:96px;height:96px;border-radius:50%;border:0;background:var(--yellow);color:var(--on-yellow);display:flex;align-items:center;justify-content:center}
.recbtn.live{background:var(--brand);color:var(--on-brand);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(108,59,224,.18)}}
@media (prefers-reduced-motion:reduce){.recbtn.live{animation:none}}
.timer{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums}
video.cam{width:100%;border-radius:14px;background:#000;max-height:50vh}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--night);color:var(--on-night);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem;z-index:40;max-width:90vw;text-align:center}
.toast[hidden]{display:none}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.sw input{width:26px;height:26px;accent-color:var(--brand);flex:none}
.sum{background:#fff;color:#1b1446;border-radius:8px;padding:16px;font-size:.9rem;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line)}
.easybtns{display:flex;flex-direction:column;gap:14px}
.err{color:var(--danger);font-weight:600;font-size:.9rem}
.empty{text-align:center;padding:26px 12px;display:flex;flex-direction:column;gap:12px;align-items:center}

.camscreen{position:fixed;inset:0;z-index:4;background:#0B0722;color:#fff;overflow:hidden}
.hcam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#0B0722}
.camfb{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:linear-gradient(160deg,#1B1446,#6C3BE0)}
.camfb[hidden]{display:none}
.camshade{position:absolute;left:0;right:0;z-index:2;pointer-events:none}
.camshade.top{top:0;height:160px;background:linear-gradient(rgba(11,7,34,.7),transparent)}
.camshade.bot{bottom:0;height:240px;background:linear-gradient(transparent,rgba(11,7,34,.75))}
.camtop{position:absolute;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.cbrand{font-family:var(--display);font-weight:700;font-size:1.5rem}
.camhint{font-size:.82rem;font-weight:700;background:rgba(11,7,34,.55);padding:6px 12px;border-radius:999px}
.camdue{font-size:.85rem;font-weight:800;background:var(--yellow);color:var(--on-yellow);border:0;padding:8px 14px;border-radius:999px;min-height:40px}
.camside{position:absolute;z-index:3;right:max(10px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-46%);display:flex;flex-direction:column;gap:14px;align-items:center}
.cbtn{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;padding:0}
.cbtn .cc{width:52px;height:52px;border-radius:50%;background:rgba(11,7,34,.5);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.35)}
.cbtn.sm .cc{width:44px;height:44px}
.cbtn .cl{font-size:.7rem;font-weight:800;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.camside .cbtn:first-child .cc{background:var(--yellow);color:var(--on-yellow);border-color:#fff;width:60px;height:60px}
.cambot{position:absolute;z-index:3;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,env(safe-area-inset-right,0px)) calc(26px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.gal{width:52px;height:52px;border-radius:12px;border:2px solid #fff;background:rgba(11,7,34,.5);color:#fff;overflow:hidden;padding:0;display:flex;align-items:center;justify-content:center}
.gal img{width:100%;height:100%;object-fit:cover}
.shutter{width:84px;height:84px;border-radius:50%;border:5px solid #fff;background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.shutter span{width:62px;height:62px;border-radius:50%;background:var(--yellow);display:block}
.shutter:active span{transform:scale(.9)}

html.feedmode,body.feedmode{overflow:hidden}
.top .brand,.cbrand{letter-spacing:-.5px}
.card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}
.card.glass{background:rgba(11,7,34,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card.glow{background:linear-gradient(135deg,#3A1C9E,#7C4DFF);border-color:transparent;box-shadow:0 10px 30px rgba(124,77,255,.35)}
.card.warn .muted{color:var(--on-warn)}
.btn.alt{border-color:rgba(255,255,255,.55);color:#fff}
.chip{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.chip.on{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.chip.blue{background:rgba(127,162,255,.2);color:#BFD0FF;border-color:transparent}
.state{background:rgba(127,162,255,.22);color:#C7D6FF}
.state.decidido{background:rgba(255,200,61,.22);color:var(--yellow)}
.state.cerrado{background:rgba(255,255,255,.14);color:#D9D3F7}
.back,.link{color:#C9B8FF}
.link.danger{color:var(--danger)}
input[type=text],input[type=datetime-local],textarea,select{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
input::placeholder,textarea::placeholder{color:#8F87C4}
option{color:#1B1446}
.sheet{background:#120C38;color:#fff;box-shadow:0 -20px 60px rgba(0,0,0,.6);animation:sheetUp .32s cubic-bezier(.2,.8,.2,1) both}
.layer{background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.985)}to{opacity:1;transform:none}}
#app.enter>*{animation:rise .36s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){#app.enter>*,.sheet{animation:none}}
.recbtn{box-shadow:0 0 0 10px rgba(255,200,61,.18)}
/* barra inferior de vidrio con la cámara al centro */
.nav{background:rgba(11,7,34,.78);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.1);z-index:8}
.nav button{color:#9A92CC}
.nav button.on{color:#fff}
.nav button.on svg{filter:drop-shadow(0 0 8px rgba(124,77,255,.9))}
.nav .navcam{flex:none;width:62px;height:62px;min-height:0;margin:-18px 6px 0;border-radius:50%;background:var(--yellow);color:var(--on-yellow);border:4px solid var(--bg);box-shadow:0 8px 24px rgba(255,200,61,.35);display:flex;align-items:center;justify-content:center;padding:0}
.nav .navcam span{display:none}
/* hilos como portadas */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;overflow:hidden;aspect-ratio:3/4;padding:0;border:0;border-radius:20px;background:#181240;color:#fff;display:block;min-height:0}
.tile .tcov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tshade{position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(11,7,34,.92))}
.tin{position:absolute;left:0;right:0;bottom:0;padding:12px;display:flex;flex-direction:column;gap:5px;align-items:flex-start;text-align:left}
.tile .name{font-family:var(--display);font-size:1.15rem;font-weight:700;line-height:1.15}
.tmeta{font-size:.75rem;font-weight:600;color:#D8D2F5}
.g0{background:linear-gradient(160deg,#3A1C9E,#7C4DFF)}
.g1{background:linear-gradient(160deg,#12307A,#2358E6)}
.g2{background:linear-gradient(160deg,#1B1446,#6C3BE0)}
.g3{background:linear-gradient(160deg,#2358E6,#6C3BE0)}
/* feed vertical a pantalla completa */
.feed{position:fixed;inset:0;z-index:3;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;background:var(--bg)}
.feed.prox{scroll-snap-type:y proximity}
.feedtop{position:fixed;z-index:6;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(11,7,34,.75),transparent);pointer-events:none}
.fcard{position:relative;height:100vh;height:100svh;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#0B0722;border:0;border-radius:0;padding:0;display:block}
.fbgimg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(28px) brightness(.55) saturate(1.2)}
.fphoto{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);line-height:0;max-width:calc(100% - 24px);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.fphoto>img{max-width:calc(100vw - 96px);max-height:58svh;width:auto;height:auto;display:block}
.fshade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(transparent 45%,rgba(11,7,34,.92))}
.fshade.heavy{background:linear-gradient(rgba(11,7,34,.45),rgba(11,7,34,.92))}
.finfo{position:absolute;left:0;right:78px;bottom:0;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;z-index:2}
.fmeta{font-weight:800;font-size:.85rem;color:#C7D6FF}.fmeta::first-letter{text-transform:uppercase}
.ftxt{font-size:1.08rem;line-height:1.4;text-shadow:0 1px 8px rgba(0,0,0,.6);overflow-wrap:anywhere;white-space:pre-wrap}
.ftxt.dim{color:#CFC8F4}
.fcard.nophoto .ftxt{font-family:var(--display);font-size:1.6rem;line-height:1.25;font-weight:600}
.fcard.nophoto .finfo{top:96px;justify-content:center;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.fside{position:absolute;z-index:3;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;align-items:center}
.fplayer{display:flex;align-items:center;gap:10px;background:rgba(11,7,34,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;padding:6px 14px 6px 6px}
.fplay{width:52px;height:52px;border-radius:50%;border:0;background:var(--yellow);color:var(--on-yellow);display:flex;align-items:center;justify-content:center;flex:none;padding:0}
.fplay .ipause{display:none}.fplayer.playing .iplay{display:none}.fplayer.playing .ipause{display:inline-flex}
.fplayer .fbar{flex:1;min-width:30px;height:28px;display:flex;align-items:center;cursor:pointer;position:relative}
.fbar::before{content:"";position:absolute;left:0;right:0;height:5px;border-radius:3px;background:rgba(255,255,255,.28)}
.ffill{position:relative;height:5px;border-radius:3px;background:var(--yellow);width:0}
.fplayer .dur{font-size:.78rem;color:#fff;white-space:nowrap}
.pin{z-index:2;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.fhead{position:relative;min-height:100vh;min-height:100svh;scroll-snap-align:start;overflow:hidden;background:#0B0722}
.fhin{position:relative;z-index:2;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.swipe{text-align:center;font-weight:700;font-size:.85rem;color:#C9B8FF;padding-top:6px}
.top .brand,.top h1{color:#fff}
.brand{color:#fff}
.nav-in{align-items:center}

/* fondo vivo: la última foto o la cámara detrás de todas las pantallas */
#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(160deg,#2A1670,#0B0722 70%);overflow:hidden}
#bg.hide{display:none}
#bg img,#bg video{position:absolute;inset:-30px;width:calc(100% + 60px);height:calc(100% + 60px);object-fit:cover;filter:blur(26px) saturate(1.25);transform:scale(1.05)}
#bg video{filter:blur(22px) saturate(1.2)}
#bg [hidden]{display:none}
.bgshade{position:absolute;inset:0;background:linear-gradient(rgba(11,7,34,.55),rgba(11,7,34,.82))}
#app{position:relative;z-index:1}
.card{background:rgba(11,7,34,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tile{background:rgba(11,7,34,.5)}
.feed{background:transparent}
.fcard,.fhead{background:none}
.fcard.nophoto{background:none}
.fcard.nophoto.g0,.fcard.nophoto.g1,.fcard.nophoto.g2,.fcard.nophoto.g3{background-blend-mode:normal}
.camtop .ctools{display:flex;gap:8px;align-items:center;margin-left:auto}
.camdue{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc{position:relative}
.cdot{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--yellow);color:var(--on-yellow);font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #0B0722}
.cdot.sm{min-width:18px;height:18px;font-size:.68rem}
.cmenu-bg{position:absolute;inset:0;z-index:4}
.cmenu{position:absolute;z-index:5;right:max(14px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));width:210px;background:rgba(11,7,34,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:6px;display:flex;flex-direction:column;animation:rise .2s ease both}
.cmenu button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;background:none;border:0;color:#fff;font-weight:700;border-radius:12px;text-align:left;position:relative}

let recog = null;

/* ---------- compartir hacia Ancla (Android, app instalada) ---------- */
async function receiveShared() {
  if (!/[?&]shared=1/.test(location.search) || !window.caches) return;
  try {
    const c = await caches.open('ancla-share'); const keys = await c.keys(); let n = 0, text = '', firstId = null;
    for (const k of keys) {
      const r = await c.match(k); const type = r.headers.get('Content-Type') || '';
      if (type.startsWith('text/')) { text += (await r.text()) + '\n'; }
      else { const blob = await r.blob(); const id = uid(); await dbPut('memos', { id, ts: Date.now() + n, photo: type.startsWith('image/') ? blob : null, audio: type.startsWith('audio/') ? blob : null, dur: 0, pins: [], text: '', threadId: null, private: false }); firstId = firstId || id; n++; }
      await c.delete(k);
    }
    history.replaceState(null, '', location.pathname);
    await load();
    if (firstId) { const m = S.memos.find(x => x.id === firstId); toast(n + (n === 1 ? ' elemento recibido.' : ' elementos recibidos.')); editMemo(m, text.trim()); }
    else if (text.trim()) openSheet({ text: text.trim() });
  } catch (e) {}
}
