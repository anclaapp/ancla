.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:0;
  background:var(--brand);color:var(--on-brand);font-weight:700;font-size:1rem;text-decoration:none}

input[type=text],input[type=datetime-local],textarea,select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px 14px;font-weight:500;color:var(--ink)}

.rec{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0}

video.cam{width:100%;border-radius:14px;background:#000;max-height:50vh}

.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}

.easybtns{display:flex;flex-direction:column;gap:14px}

.camshade{position:absolute;left:0;right:0;z-index:2;pointer-events:none}

.cbrand{font-family:var(--display);font-weight:700;font-size:1.5rem}

.cbtn{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;padding:0}
.cbtn .cc{width:52px;height:52px;border-radius:50%;background:rgba(11,7,34,.5);display:flex;align-items:center;justify-content:center;border:1.5px solid rgba(255,255,255,.35)}

.gal img{width:100%;height:100%;object-fit:cover}

</style></head><body><div id="app"></div><div id="layer"></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div><script>
(() => {
'use strict';
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ---------- almacenamiento local (IndexedDB, con respaldo en memoria) ---------- */
let MEM = false; const mem = { memos: [], threads: [] }; let _db;
function idb() {

async function dbAll(st) { if (MEM) return mem[st].slice(); try { return await tx(st, 'readonly', s => s.getAll()); } catch (e) { MEM = true; return mem[st].slice(); } }

/* ---------- estado ---------- */
const S = { view: 'home', tab: 'home', threadId: null, memos: [], threads: [], easy: false, sheet: null, modal: null, q: '', pos: null, dismissed: {}, listening: false };
try { S.easy = localStorage.getItem('ancla.easy') === '1'; } catch (e) {}

const thr = id => S.threads.find(t => t.id === id);

const urls = [];
async function load() {
  urls.splice(0).forEach(u => URL.revokeObjectURL(u));
  S.threads = await dbAll('threads');
  S.memos = (await dbAll('memos')).sort((a, b) => b.ts - a.ts);
  S.memos.forEach(m => {
    if (m.photo) { m.photoUrl = URL.createObjectURL(m.photo); urls.push(m.photoUrl); }
    if (m.audio) { m.audioUrl = URL.createObjectURL(m.audio); urls.push(m.audioUrl); }
  });
}
async function reload() { await load(); render(); }

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }
function setHash(h) { try { if (h) { if (location.hash !== '#' + h) location.hash = h; } else if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }

/* ---------- vistas ---------- */
function nav() {
  const item = (k, i, l) => `<button data-act="tab" data-tab="${k}" class="${S.tab === k ? 'on' : ''}" aria-current="${S.tab === k ? 'page' : 'false'}">${ic(i)}<span>${l}</span></button>`;
  return `<nav class="nav" aria-label="Principal"><div class="nav-in">${item('cam', 'cam', 'Cámara')}${item('home', 'home', 'Hilos')}${item('time', 'clock', 'Cronología')}${item('search', 'search', 'Buscar')}${item('more', 'more', 'Más')}</div></nav>`;
}
function view() {
  let h;
  if (S.view === 'home' && S.tab === 'cam') return camView();
  if (S.view === 'thread') h = threadView();
  else if (S.tab === 'time') h = timeView();
  else if (S.tab === 'search') h = searchView();
  else if (S.tab === 'more') h = moreView();

let homeStream = null, homeFacing = null, homeBusy = false;

function camView() {
  const inbox = S.memos.filter(isInbox).length, last = S.memos.find(m => m.photoUrl);
  const due = S.threads.find(t => t.remind && !t.remind.done && t.state !== 'cerrado' && !S.dismissed[t.id] && ((t.remind.type === 'date' && t.remind.at <= Date.now()) || (t.remind.type === 'place' && S.pos && dist(S.pos, t.remind) <= t.remind.r)));

  <div class="camfb" id="camfb" ${S.canCam && !S.camDenied ? 'hidden' : ''}><h2>Tu cámara</h2><p>${S.canCam ? 'Permite la cámara para verla aquí.' : 'Aquí la cámara en vivo no está disponible.'}</p><label class="btn yellow" style="cursor:pointer">${ic('cam')} Tomar foto con el teléfono<input type="file" accept="image/*" capture="environment" hidden data-file="homephoto"></label></div>
  <div class="camshade top"></div><div class="camshade bot"></div>

const STOP = new Set('de la el que por en un una los las del al se me mi con para es y o a lo le cuanto cuantos cual cuales como cuando donde quien pedian pedia fue fui era hay que qué'.split(' '));
function results(q) {
  const toks = norm(q).replace(/[^a-z0-9ñ ]/g, ' ').split(/\s+/).filter(w => w.length > 2 && !STOP.has(w));
  if (!toks.length) return `<div class="card"><div class="eyebrow">Prueba preguntar</div><div class="row">${S.threads.slice(0, 3).map(t => `<button class="chip" data-act="ask" data-q="${esc('¿Qué decidí sobre ' + t.name + '?')}">${esc(t.name)}</button>`).join('') || '<span class="muted">Cuando guardes recuerdos, podrás buscarlos aquí.</span>'}</div></div>`;
  const scored = S.memos.map(m => {
    const t = m.threadId && thr(m.threadId);
    const hay = norm([m.text, t && t.name, t && (t.decisions || []).map(d => d.text + ' ' + (d.why || '')).join(' ')].join(' '));
    const sc = toks.reduce((n, w) => n + (hay.includes(w) ? 1 : 0), 0);
    return { m, sc };
  }).filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc || b.m.ts - a.m.ts).slice(0, 8);
  const decHits = [];
  S.threads.forEach(t => (t.decisions || []).forEach(d => { const hay = norm(t.name + ' ' + d.text + ' ' + (d.why || '')); if (toks.some(w => hay.includes(w))) decHits.push({ t, d }); }));
  if (!scored.length && !decHits.length) return `<div class="card"><p>No encontré nada sobre eso en lo que guardaste.</p><p class="muted">Prueba con otras palabras, o añade una nota de voz o de texto sobre el tema.</p></div>`;
  let h = '';
  const top = scored[0] && scored[0].m;
  if (top && top.text) h += `<div class="card"><div class="eyebrow">Lo que guardaste</div><p><b>«${esc(snippet(top.text, toks))}»</b></p><p class="muted">${fmtDate(top.ts)}${top.threadId && thr(top.threadId) ? ' · ' + esc(thr(top.threadId).name) : ''}</p></div>`;
  decHits.slice(0, 3).forEach(x => { h += `<div class="card"><div class="eyebrow">Decisión · ${esc(x.t.name)}</div><p><b>${esc(x.d.text)}</b></p>${x.d.why ? `<p class="muted">Motivo: ${esc(x.d.why)}</p>` : ''}</div>`; });
  if (scored.length) h += `<h3>Recuerdos relacionados</h3>` + scored.map(x => memoCard(x.m, true)).join('');
  return h;
}
function snippet(text, toks) {
  const n = norm(text); let i = -1; for (const w of toks) { i = n.indexOf(w); if (i >= 0) break; }

  if (t.dataset.act === 'camfirst') { S.camfirst = t.checked; try { localStorage.setItem('ancla.camfirst', S.camfirst ? '1' : '0'); } catch (x) {} return; }
  if (t.dataset.act === 'easy') { S.easy = t.checked; try { localStorage.setItem('ancla.easy', S.easy ? '1' : '0'); } catch (x) {} return render(); }
  if (t.dataset.sum) { S.modal.o[t.dataset.sum] = t.checked; $('#sumprev').innerHTML = summaryHTML(thr(S.threadId), S.modal.o, false); return; }
  if (t.dataset.draft === 'private') { S.sheet.d.private = t.checked; return; }
  if (t.dataset.file) {
    const files = Array.from(t.files || []); t.value = ''; if (!files.length) return;
    if (t.dataset.file === 'homephoto') { openSheet({}); setPhoto(files[0]); renderLayer(); }
    else if (t.dataset.file === 'photo') { setPhoto(files[0]); renderLayer(); }
    else if (t.dataset.file === 'audio') setAudioFile(files[0]);
    else if (t.dataset.file === 'inbox') { let i = 0; for (const f of files) await dbPut('memos', { id: uid(), ts: Date.now() + i++, photo: f, audio: null, dur: 0, pins: [], text: '', threadId: null, private: false }); await reload(); toast(files.length + ' en la bandeja.'); }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.draft && t.dataset.draft !== 'private') { S.sheet.d[t.dataset.draft] = t.value; return; }
  if (t.id === 'q') { S.q = t.value; $('#results').innerHTML = results(S.q); }
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  const v = id => (($('#' + id) || {}).value || '').trim(), t = thr(S.threadId), k = f.dataset.form;
  if (k === 'decision') { t.decisions = (t.decisions || []).concat({ id: uid(), ts: Date.now(), text: v('f1'), why: v('f2') }); if (t.state === 'explorando' || t.state === 'comparando') t.state = 'decidido'; }
  if (k === 'close') { t.closure = { ts: Date.now(), result: v('f1'), learn: v('f2') }; t.state = 'cerrado'; }
  if (k === 'edit-thread') { t.name = v('f1'); t.state = v('f2'); t.next = v('f3'); }
  if (k === 'remind') {
    const m = S.modal;
    if (m.mode === 'date') { const at = new Date(v('f1')).getTime(); if (!at) return; t.remind = { type: 'date', at, q: v('f2') }; }
    else { if (!m.pos) { m.err = 'Primero guarda el lugar.'; return renderLayer(); } t.remind = { type: 'place', lat: m.pos.lat, lng: m.pos.lng, r: Number(v('f4')) || 200, q: v('f2') }; checkPlace(); }
    delete S.dismissed[t.id];
  }
  await dbPut('threads', t); S.modal = null; setHash(''); await reload(); toast('Guardado.');
});
document.addEventListener('loadedmetadata', e => {
  const a = e.target; if (a.tagName !== 'AUDIO' || a.duration !== Infinity) return;
  a.currentTime = 1e101; a.addEventListener('timeupdate', function f() { a.removeEventListener('timeupdate', f); a.currentTime = 0; });
}, true);
window.addEventListener('hashchange', () => { if (!location.hash) { if (S.sheet) closeSheet(); else if (S.modal) closeModal(); else if (S.view !== 'home') { S.view = 'home'; render(); } } });
document.addEventListener('visibilitychange', () => { syncHome(); if (!document.hidden) { checkPlace(); if (!S.sheet && !S.modal) render(); } });

function render() {
  document.documentElement.classList.toggle('easy', S.easy);
  $('#app').innerHTML = view();
  if (S.tab === 'more') { try { navigator.storage.estimate().then(e => { const el = $('#storageinfo'); if (el) el.textContent = 'Usado: ' + (e.usage / 1048576).toFixed(1) + ' MB de ' + Math.round(e.quota / 1048576) + ' MB disponibles.'; }); } catch (x) {} }
  renderLayer();
  syncHome();
}
(async () => {
  try { await load(); } catch (e) { MEM = true; }
  render(); await receiveShared(); render(); checkPlace();
  window.__ancla = { S, load, render };
})();
})();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
